name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (MSVC x64)
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Locate binary
        id: bin
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter RobloxExt.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "RobloxExt.exe not found" }
          Write-Output "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobloxExt
          path: ${{ steps.bin.outputs.path }}
